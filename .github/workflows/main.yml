# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Doxygen Action

# Only the default branch publishes documentation. Running on every push
# gave a write token, next to two third-party actions, to any branch --
# and the gh-pages push would come back to this workflow as a push itself.
on:
  push:
    branches: [ "master" ]

# Read-only by default; the one job that publishes asks for write itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Actions pinned by commit SHA (version in the comment): a re-pointed tag
    # must not change what runs while this job holds a write token.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # actions-gh-pages pushes with the github_token it is given below;
        # nothing else here needs git credentials.
        persist-credentials: false

    - name: Doxygen Action
      uses: mattnotmitt/doxygen-action@b84fe17600245bb5db3d6c247cc274ea98c15a3b # v1.12
      with:
        doxyfile-path: "./Doxyfile" # default is ./Doxyfile
        working-directory: "." # default is .

    - name: Deploy
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/html
